plugins { id 'com.android.application' }

android {
    namespace 'de.tomnaiser.panoramaandroid'
    compileSdk 35

    defaultConfig {
        applicationId providers.gradleProperty('validationApplicationId').getOrElse('de.tomnaiser.panoramaandroid')
        minSdk 26
        targetSdk 35
        versionCode 40
        versionName '0.6.27'
        testInstrumentationRunner 'de.tomnaiser.panoramaandroid.AppChecks'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
